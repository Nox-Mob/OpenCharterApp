name: Live demo checks

# The smoke test runs against STAGING (openapphub-staging) and the suite demo: it signs in as
# demo@demo.openapphub.org and test@demo.openapphub.org (password public, reset every 12 hours by
# OpenAppHub's demo-reset workflow) and checks the demo and the security rules through the API.
# Settings come from wrangler.jsonc env.staging; no secrets are needed. It fails until staging is
# seeded (OpenAppHub's staging.yml, then this repo's Migrate -> staging).
#
# The end-to-end tests still target the retired Lovable Cloud demo and need the same rewrite.
# Repository variable (optional): E2E_BASE_URL, a deployed site to also run the checkout test.
#   Used on pushes to main, the daily run and manual runs only: a pull request tests its own code
#   on a local dev server, because the deployed site still runs main until the merge (D-212).
on:
  push:
    branches: [main, BoardUpdates]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * *" # daily 06:41 UTC: catches backend changes made outside this repository
  workflow_dispatch:

concurrency:
  group: live-demo
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke test (live backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run the smoke test
        run: bun run test:smoke

  e2e:
    # Google Chrome stable rather than Playwright's bundled Chromium, which lags Chrome's security
    # fixes; the runner isn't root, so Chrome's sandbox stays on (D-186). Playwright is pinned at
    # 1.64.1. Runs after the smoke test even if it failed, never at the same time.
    name: End-to-end (Playwright)
    needs: smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chrome
      - name: Run end-to-end tests
        run: bun run test:e2e
        env:
          CI: "true"
          E2E_BROWSER_CHANNEL: chrome
          E2E_BASE_URL: ${{ github.event_name != 'pull_request' && vars.E2E_BASE_URL || '' }}
          SMOKE_DEMO_PASSWORD: ${{ secrets.SMOKE_DEMO_PASSWORD }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
