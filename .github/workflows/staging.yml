name: Staging

# Spec §10.2 (D-219): every push to main updates STAGING only, never production.
#   1. migrations (and demo seed) against the staging database, once the vendored runner
#      scripts/migrate.mjs exists (suite step 5); until then this step is skipped with a notice;
#   2. build with the staging values from wrangler.jsonc (scripts/worker-env.mjs);
#   3. `wrangler deploy --env staging` (Worker opencharterapp-staging).
# The whole job skips with a notice until staging exists: secrets STAGING_DATABASE_URL,
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and the staging publishable key in
# wrangler.jsonc. Staging is today's OpenBoardApp project, reused after Board moves (spec §0.1).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.152.0

jobs:
  staging:
    name: Migrate and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      HAS_SECRETS: ${{ secrets.STAGING_DATABASE_URL != '' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Is staging set up?
        id: ready
        run: |
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::notice::Staging isn't set up yet (STAGING_DATABASE_URL, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID), so nothing was deployed."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif ! node scripts/worker-env.mjs staging --check; then
            echo "::notice::wrangler.jsonc still has a placeholder in env.staging (the staging publishable key), so nothing was deployed."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.ready.outputs.go == 'true'
      - run: bun install --frozen-lockfile
        if: steps.ready.outputs.go == 'true'
      - name: Migrate staging (with demo seed)
        if: steps.ready.outputs.go == 'true'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -f scripts/migrate.mjs ]; then
            node scripts/migrate.mjs --seed
          else
            echo "::notice::No migration runner yet (suite step 5); staging's database was not changed."
          fi
      - name: Build with the staging settings
        if: steps.ready.outputs.go == 'true'
        run: |
          node scripts/worker-env.mjs staging >> "$GITHUB_ENV"
      - run: bun run build
        if: steps.ready.outputs.go == 'true'
      - name: Deploy the staging Worker
        if: steps.ready.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx "wrangler@${WRANGLER_VERSION}" deploy --config .output/server/wrangler.json --env staging
