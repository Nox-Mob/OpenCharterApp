name: CI

# Checks that need no live backend (D-115, D-197): every push to any branch and every pull
# request, plus a weekly run on the default branch so new dependency advisories surface even
# when nothing is pushed. The live-demo checks (smoke and end-to-end) are in live.yml.
on:
  push:
    branches: [staging]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (security review 2026-11-14): the job only reads the repository.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: No environment files tracked (spec §7.1)
        run: |
          tracked=$(git ls-files '.env*' '**/.env*' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then echo "::error::Only .env.example may be committed: $tracked"; exit 1; fi
      - run: bun install --frozen-lockfile
      - name: Vendored shared code matches OpenAppHub
        run: node scripts/check-shared.mjs
      - name: Lint
        run: bun run lint
      - name: Formatting
        run: bun run format:check
      - name: Type check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Migration conventions
        run: bun run check:migrations

  database:
    name: Database rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install psql
        # GitHub's Ubuntu runners ship psql; install it through apt only when it's missing,
        # so an Ubuntu mirror outage doesn't fail the run.
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      # The runner applies the vendored core, then db/migrations, each file in one transaction.
      - name: Apply migrations and run rule tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash scripts/db-test.sh

  performance:
    # One roster grown to 5,000, 10,000 and 20,000 members; fails if a heavy read is over budget at
    # any size (D-181, D-209). The budget is
    # looser than the 1 second target because shared runners are slower and vary.
    name: Performance (5,000 to 20,000 members)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install psql
        # GitHub's Ubuntu runners ship psql; install it through apt only when it's missing,
        # so an Ubuntu mirror outage doesn't fail the run.
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Seed a large roster and time the heavy reads
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          PERF_BUDGET_MS: "3000"
        run: bash scripts/db-perf.sh

  audit:
    # Fails on high or critical advisories in any dependency, and on any advisory in what ships
    # to production (development-only moderate ones are tracked in docs/security-review.md §1.6).
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: High or critical, anywhere
        run: bun audit --audit-level=high
      - name: Anything in production dependencies
        run: bun audit --production --audit-level=low

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  docs-check:
    # Code changes come with docs or tests (instructions.md §9). Label "no-docs-needed" to skip.
    name: Docs check
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: bash scripts/docs-check.sh origin/${{ github.base_ref }}
