name: Supabase database

# Phase 0 of the move off Lovable Cloud (docs/migration/). Three jobs:
# - has-migrations: does this ref have supabase/migrations? Until the cutover `main` doesn't, so
#   replay is skipped there and deploy refuses to run.
# - replay: rebuilds the whole database from supabase/migrations on a local Supabase stack, lints
#   it, checks every public table has RLS and grants, and runs the database tests against it.
#   Every pull request, and pushes to main and supabase-migration.
# - deploy: pushes the migration history to the new Supabase project, through the IPv4 session
#   pooler (runners have no IPv6). Manual only ("Run workflow"), in the supabase-prod environment,
#   which needs a reviewer's approval. dry_run (default on) only lists what would be applied.
#
# Secrets (repository or supabase-prod environment): SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
# SUPABASE_PROJECT_ID. The access token needs the scopes project_admin_read, projects_read,
# database_pooling_config_read and branching_production_read.
#
# A local .env (no longer tracked since D-219) could point at a hosted project, and the Supabase CLI reads SUPABASE_PROJECT_ID
# from it, so every job moves it aside before running the CLI.
on:
  pull_request:
  push:
    branches: [main, supabase-migration]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: list the migrations that would be applied, change nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # One pinned CLI version everywhere (docs/migration/phase-0-inventory.md).
  SUPABASE_CLI_VERSION: 2.122.1

jobs:
  has-migrations:
    name: Has supabase/migrations
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if compgen -G "supabase/migrations/*.sql" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "$(ls supabase/migrations/*.sql | wc -l) migrations in supabase/migrations"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No supabase/migrations on this ref: replay is skipped, deploy refuses to run."
          fi

  replay:
    name: Replay migrations (local Supabase)
    needs: has-migrations
    if: github.event_name != 'workflow_dispatch' && needs.has-migrations.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Move the Lovable .env aside
        run: if [ -f .env ]; then mv .env .env.lovable; fi
      - name: Start the stack (db, auth, rest, storage, gateway)
        run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Rebuild the database from the migrations
        run: supabase db reset --local
      - name: Lint
        run: supabase db lint --local --level error --fail-on error
      - name: Every public table has RLS and grants
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -X -f supabase/ci/post-replay-check.sql
      - name: Database tests (db/tests, SQL)
        run: bash supabase/ci/db-tests.sh "$DB_URL"
      - name: A password for this run's demo accounts
        # Generated per run, masked, never stored: the fixtures and the smoke test share it.
        run: |
          pw="ci-$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "SMOKE_DEMO_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: CI-only test accounts and organizations
        run: PGOPTIONS="-c fixture.demo_password=$SMOKE_DEMO_PASSWORD" psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -f supabase/ci/fixtures.sql
      - name: Test-Demo seed (the SQL Editor script still runs)
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -f supabase/scripts/seed-test-demo.sql > /dev/null
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Smoke test against the local stack (vitest, Node)
        run: bash supabase/ci/smoke-local.sh
      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Deploy migrations (supabase-prod)
    needs: has-migrations
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-prod
    concurrency:
      group: supabase-deploy
      cancel-in-progress: false
    steps:
      - name: Refuse to run without supabase/migrations
        if: needs.has-migrations.outputs.present != 'true'
        run: |
          echo "::error::This ref has no supabase/migrations; nothing to deploy. Run the workflow on a branch that has them."
          exit 1
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Move the Lovable .env aside
        run: if [ -f .env ]; then mv .env .env.lovable; fi
      - name: Check the secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          missing=""
          for n in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (add them to the supabase-prod environment or the repository)."
            exit 1
          fi
      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -o pipefail
          if ! supabase link --project-ref "$SUPABASE_PROJECT_ID" 2>&1 | tee link.log; then
            if grep -qiE '403|forbidden' link.log; then
              echo "::error::The Management API refused the access token (403). It needs the scopes project_admin_read, projects_read, database_pooling_config_read and branching_production_read."
            fi
            exit 1
          fi
      - name: Resolve the IPv4 session pooler
        id: pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o pooler.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/database/pooler")
          if [ "$status" = "403" ]; then
            echo "::error::GET /v1/projects/{ref}/config/database/pooler returned 403. The access token needs the scopes project_admin_read, projects_read, database_pooling_config_read and branching_production_read."
            exit 1
          fi
          if [ "$status" != "200" ]; then
            echo "::error::GET /v1/projects/{ref}/config/database/pooler returned HTTP $status."
            exit 1
          fi
          # The shared pooler (Supavisor) of the primary database: IPv4, *.pooler.supabase.com.
          read -r host user dbname < <(jq -r '
            [ (if type == "array" then .[] else . end)
              | select((.database_type // "PRIMARY") == "PRIMARY")
              | select((.db_host // "") | endswith(".pooler.supabase.com")) ][0]
            | "\(.db_host // "") \(.db_user // "") \(.db_name // "postgres")"' pooler.json)
          rm -f pooler.json
          if [ -z "$host" ] || [ -z "$user" ]; then
            echo "::error::No shared pooler (*.pooler.supabase.com) found for this project."
            exit 1
          fi
          enc=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          url="postgresql://${user}:${enc}@${host}:5432/${dbname}"
          echo "::add-mask::$enc"
          echo "::add-mask::$url"
          echo "Session pooler: $host:5432 (user $user)"
          {
            echo "db_url<<__POOLER_URL__"
            echo "$url"
            echo "__POOLER_URL__"
          } >> "$GITHUB_OUTPUT"
      - name: Push the migrations
        env:
          DB_URL: ${{ steps.pooler.outputs.db_url }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          enc=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$enc"
          echo "::add-mask::$DB_URL"
          args=(db push --db-url "$DB_URL" --yes)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          supabase "${args[@]}" > push.log 2>&1
          code=$?
          # Redact the URL, the encoded password and the raw password before anything is shown.
          python3 - push.log <<'PY'
          import os, sys, urllib.parse
          p = sys.argv[1]
          text = open(p, encoding="utf-8", errors="replace").read()
          pw = os.environ["SUPABASE_DB_PASSWORD"]
          for s in (os.environ["DB_URL"], urllib.parse.quote(pw, safe=""), pw):
              if s:
                  text = text.replace(s, "***")
          open(p, "w", encoding="utf-8").write(text)
          PY
          cat push.log
          {
            if [ "$DRY_RUN" = "true" ]; then echo "## Dry run: migrations that would be applied"; else echo "## Migrations pushed"; fi
            echo
            echo '```'
            cat push.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f push.log
          if [ $code -ne 0 ] && grep -qiE '403|forbidden' "$GITHUB_STEP_SUMMARY"; then
            echo "::error::A 403 from Supabase. The access token needs the scopes project_admin_read, projects_read, database_pooling_config_read and branching_production_read."
          fi
          exit $code
